[project]
name = "agent-from-scratch"
version = "0.1.0"
description = "Learning project: build an AI agent framework from scratch"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv",
    "anthropic",
    "litellm",
    "pydantic",
    "datasets",
    "tqdm",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: marks tests that call real APIs (run explicitly with -m live)"]
addopts = ["-m", "not live"]

[tool.ruff]
target-version = "py313"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
