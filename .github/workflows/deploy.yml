name: Deploy

on:
  push:
    branches: [master, main]

# Only one deploy at a time; cancel any pending deploy if a newer commit arrives.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  full-eval:
    name: Full Eval (all 20 tasks)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run full GAIA benchmark (20 tasks, baseline config)
        run: |
          uv run --group eval python experiments/ch08_gaia.py \
            --tasks 20 --config baseline
        timeout-minutes: 30

      - name: Judge results
        run: |
          uv run --group eval python experiments/ch10_eval.py \
            --section a \
            --results results/ch08_gaia_baseline.json

      - name: Run adversarial eval
        run: |
          uv run --group eval python experiments/ch10_eval.py \
            --section d

      - name: Quality gate (full dataset)
        id: gate
        run: |
          uv run python scripts/eval_gate.py \
            --report results/ch10_section_a_report.json \
            --baseline results/eval_baseline.json \
            --output results/eval_gate_result.json \
            --github-summary
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-eval-${{ github.run_number }}
          path: results/
          retention-days: 30

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: full-eval
    environment: production
    # Only deploy if eval gate passed (job succeeded with exit code 0)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies (prod only, no dev/eval groups)
        run: uv sync

      # Write SSH key from secret
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      # Sync code to server (exclude .env, sessions.db, results/)
      - name: Sync code
        run: |
          rsync -avz \
            --exclude='.env' \
            --exclude='*.db' --exclude='*.db-shm' --exclude='*.db-wal' \
            --exclude='results/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            . "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"

      # Install deps and restart service on the server
      - name: Install + restart
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             uv sync && \
             systemctl restart --user agentkit.service"

      # Health check: agent doctor verifies all components are working
      - name: Health check (agent doctor)
        id: doctor
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH }} && uv run agent doctor"

      # Rollback on doctor failure: re-deploy previous git ref
      - name: Rollback on failure
        if: failure() && steps.doctor.outcome == 'failure'
        run: |
          echo "Health check failed — rolling back to previous version"
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             git fetch origin && \
             git checkout HEAD~1 && \
             uv sync && \
             systemctl restart --user agentkit.service"

# Required GitHub Secrets:
#   ANTHROPIC_API_KEY   — Anthropic API key for eval and agent
#   TAVILY_API_KEY      — Tavily search API key
#   DEPLOY_SSH_KEY      — Private SSH key for rsync/SSH deploy
#   DEPLOY_HOST         — Hostname or IP of the production server
#   DEPLOY_USER         — SSH username
#   DEPLOY_PATH         — Absolute path to the deployment directory on server
